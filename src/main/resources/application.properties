# GENERAL
# spring.application.name=curso
server.port=8080

# DATABASE
spring.datasource.url=jdbc:mysql://localhost/cursojava?useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable debug mode
debug=true

#    JWT
# Secret key for signing JWT tokens
security.jwt.secret=qwertyuiopasdfghjklzxcvbnmqwertyui

# Issuer of the JWT token
security.jwt.issuer=Main

# la sesion dura 1 semana, Time-to-live for JWT tokens (in milliseconds), 3600000 para 1hora
security.jwt.ttlMillis=604800000

